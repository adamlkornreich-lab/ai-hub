[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hub"
version = "0.2.0"
description = "One small Python interface to OpenAI, Anthropic (Claude) and Google Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ai-hub = "ai_hub.__main__:main"

[tool.setuptools]
packages = ["ai_hub"]
